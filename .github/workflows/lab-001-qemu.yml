name: Test Lab 001 Cortex-M NVIC in QEMU
on:
  push:
    branches: [main]
    paths:
      - "labs/001-nvic-nested-interrupts/**"
      - ".github/workflows/lab-001-qemu.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-cortex-m3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi qemu-system-arm
      - name: Build and test IRQ priority scenarios
        run: make -C labs/001-nvic-nested-interrupts test
